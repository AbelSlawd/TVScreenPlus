name: 🐞 Bug report
description: Something does not work, crashes, or behaves strangely.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem! You can write in **English or French**.
        **Security problem?** Do not report it here: see [SECURITY.md](https://github.com/AbelSlawd/TVScreenPlus/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. I connected the TV…
        2. I opened…
        Expected: …
        Got: …
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often?
      options:
        - Every time
        - Sometimes
        - Only once
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Report from the PC
      description: |
        On the PC: right-click the 📺 tray icon › *Mode debug (statistiques en direct)* › **Copier pour un signalement**, then paste here.
        It contains the versions, your PC and TV configuration, statistics and the end of the log. Never the pairing keys.
      render: text
    validations:
      required: false

  - type: input
    id: pc
    attributes:
      label: PC
      description: Graphics card and Windows version. Not needed if you pasted the report above.
      placeholder: e.g. AMD Radeon RX 7800 XT, Windows 11 24H2
    validations:
      required: false

  - type: input
    id: tv
    attributes:
      label: TV
      description: Brand and model of the TV (or Google TV box).
      placeholder: e.g. Sony Bravia KD-55X85L, Chromecast with Google TV 4K
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: TV connection
      options:
        - Wi-Fi
        - Ethernet cable
        - I don't know
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, videos, a gamepad model, when it started (after an update?)…
    validations:
      required: false
