name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PC app
        run: dotnet build windows/TVScreenPlus/TVScreenPlus.csproj -c Release -o out -p:Version=1.0.${{ github.run_number }}
      - name: Package (app + ffmpeg + virtual display driver)
        shell: pwsh
        run: |
          $pkg = "pkg/TVScreenPlus-PC"
          New-Item -ItemType Directory -Force "$pkg/driver" | Out-Null
          Copy-Item out/TVScreenPlus.exe* $pkg
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName $pkg
          Invoke-WebRequest https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip -OutFile vdd.zip
          Expand-Archive vdd.zip vdd
          Get-ChildItem vdd -Recurse -File | Copy-Item -Destination "$pkg/driver"
          if (-not (Test-Path "$pkg/driver/MttVDD.inf")) { throw "driver inf missing" }
          & "$pkg/ffmpeg.exe" -hide_banner -filters | Select-String ddagrab
          & "$pkg/ffmpeg.exe" -hide_banner -encoders | Select-String "nvenc|amf|qsv|libx264"
          Get-ChildItem -Recurse $pkg | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: TVScreenPlus-PC
          path: pkg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Signing key (optional secret)
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"; fi
      - name: Build TV app
        working-directory: android
        env: { ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" }
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }}
      - run: cp android/app/build/outputs/apk/release/app-release.apk TVScreenPlus-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TVScreenPlus-TV
          path: TVScreenPlus-TV.apk

  release:
    if: github.event_name != 'pull_request'
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          cd TVScreenPlus-PC && zip -qr ../TVScreenPlus-PC.zip TVScreenPlus-PC && cd ..
          cp TVScreenPlus-TV/TVScreenPlus-TV.apk .
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TVScreenPlus 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **PC Windows** : `TVScreenPlus-PC.zip` → décompresser n'importe où et lancer `TVScreenPlus.exe` : il s'installe dans *Program Files*, remplace et supprime l'ancienne version. Les versions suivantes s'installent automatiquement.
            **Google TV** : `TVScreenPlus-TV.apk` → installer sur la TV ; l'application propose ensuite elle-même les mises à jour.

            Commit : ${{ github.sha }}
          files: |
            TVScreenPlus-PC.zip
            TVScreenPlus-TV.apk
