name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PC app
        run: dotnet build windows/TVScreenPlus/TVScreenPlus.csproj -c Release -o out
      - name: Package (app + ffmpeg + virtual display driver)
        shell: pwsh
        run: |
          $pkg = "pkg/TVScreenPlus-PC"
          New-Item -ItemType Directory -Force "$pkg/driver" | Out-Null
          Copy-Item out/TVScreenPlus.exe* $pkg
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName $pkg
          Invoke-WebRequest https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip -OutFile vdd.zip
          Expand-Archive vdd.zip vdd
          Get-ChildItem vdd -Recurse -File | Copy-Item -Destination "$pkg/driver"
          if (-not (Test-Path "$pkg/driver/MttVDD.inf")) { throw "driver inf missing" }
          & "$pkg/ffmpeg.exe" -hide_banner -filters | Select-String ddagrab
          & "$pkg/ffmpeg.exe" -hide_banner -encoders | Select-String "nvenc|amf|qsv|libx264"
          Get-ChildItem -Recurse $pkg | Select-Object FullName, Length
      - uses: actions/upload-artifact@v4
        with:
          name: TVScreenPlus-PC
          path: pkg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build TV app
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk TVScreenPlus-TV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TVScreenPlus-TV
          path: TVScreenPlus-TV.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
      - run: cd TVScreenPlus-PC && zip -r ../TVScreenPlus-PC.zip TVScreenPlus-PC
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            TVScreenPlus-PC.zip
            TVScreenPlus-TV/TVScreenPlus-TV.apk
