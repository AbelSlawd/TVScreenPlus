name: build
on:
  push:
  pull_request:
  workflow_dispatch:

# Read-only token by default; only the release job may write (create the release).
permissions: { contents: read }

# Third-party actions pinned to a commit (a moved tag cannot change what runs with the release token).
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # VERSION (e.g. 1.1.0) is the name people see; the machine version 1.1.<run> always increases (auto-update).
      - name: Build PC app
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim(); $mm = ($v -split '\.')[0..1] -join '.'
          dotnet build windows/TVScreenPlus/TVScreenPlus.csproj -c Release -o out "-p:Version=$mm.${{ github.run_number }}" "-p:InformationalVersion=$v"
      - name: Package (app + ffmpeg + virtual display driver + gamepad driver setup)
        shell: pwsh
        run: |
          $pkg = "pkg/TVScreenPlus-PC"
          New-Item -ItemType Directory -Force "$pkg/driver" | Out-Null
          Copy-Item out/TVScreenPlus.exe* $pkg
          # ViGEmBus (BSD-3, signed): installed silently by the app the first time a TV gamepad is used.
          Invoke-WebRequest https://github.com/nefarius/ViGEmBus/releases/download/v1.22.0/ViGEmBus_1.22.0_x64_x86_arm64.exe -OutFile "$pkg/ViGEmBus_setup.exe"
          $sig = Get-AuthenticodeSignature "$pkg/ViGEmBus_setup.exe"
          Write-Host "ViGEmBus setup signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "ViGEmBus setup signature is not valid" }
          Invoke-WebRequest https://raw.githubusercontent.com/nefarius/ViGEmBus/v1.22.0/LICENSE -OutFile "$pkg/ViGEmBus_LICENSE.txt"
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          Copy-Item (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName $pkg
          Invoke-WebRequest https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip -OutFile vdd.zip
          # Pinned version, pinned content: the driver is installed with administrator rights on every PC.
          if ((Get-FileHash vdd.zip -Algorithm SHA256).Hash -ne 'E24210692B442B39AF763536330CE78B423F19342B7A7792C26DE3944E418B3A') { throw "virtual display driver archive changed" }
          Expand-Archive vdd.zip vdd
          Get-ChildItem vdd -Recurse -File | Copy-Item -Destination "$pkg/driver"
          if (-not (Test-Path "$pkg/driver/MttVDD.inf")) { throw "driver inf missing" }
          & "$pkg/ffmpeg.exe" -hide_banner -filters | Select-String ddagrab
          & "$pkg/ffmpeg.exe" -hide_banner -encoders | Select-String "nvenc|amf|qsv|libx264"
          Get-ChildItem -Recurse $pkg | Select-Object FullName, Length
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TVScreenPlus-PC
          path: pkg

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - name: Signing key (optional secret)
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"; fi
      - name: Build TV app
        working-directory: android
        env: { ANDROID_KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" }
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease -PbuildNumber=${{ github.run_number }} -PversionName=$(tr -d '[:space:]' < ../VERSION)
      - run: cp android/app/build/outputs/apk/release/app-release.apk TVScreenPlus-TV.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TVScreenPlus-TV
          path: TVScreenPlus-TV.apk

  release:
    # main publishes the "latest" release (every PC and TV installs it); the test branch publishes a
    # pre-release that only test builds (VERSION "x.y.z-test") follow.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            VERSION
            RELEASE_NOTES.md
          sparse-checkout-cone-mode: false
          path: src
      - id: ver
        run: |
          v=$(tr -d '[:space:]' < src/VERSION)
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$(echo "$v" | cut -d. -f1-2).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          # Release text: what changed (RELEASE_NOTES.md, edited for each version) + how to install.
          {
            cat src/RELEASE_NOTES.md
            echo
            echo "**PC Windows** : \`TVScreenPlus-PC.zip\` → décompresser n'importe où et lancer \`TVScreenPlus.exe\` : il s'installe dans *Program Files*, remplace et supprime l'ancienne version. Les versions suivantes s'installent automatiquement."
            echo "**Google TV** : \`TVScreenPlus-TV.apk\` → installer sur la TV ; l'application propose ensuite elle-même les mises à jour."
            echo
            echo "Commit : ${{ github.sha }}"
          } > release_body.md
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      - run: |
          cd TVScreenPlus-PC && zip -qr ../TVScreenPlus-PC.zip TVScreenPlus-PC && cd ..
          cp TVScreenPlus-TV/TVScreenPlus-TV.apk .
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Tag v1.1.<run>: installed PCs and TVs compare it (the TV reads its last number as the update code).
          tag_name: ${{ steps.ver.outputs.tag }}
          name: TVScreenPlus ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ github.ref == 'refs/heads/main' }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body_path: release_body.md
          files: |
            TVScreenPlus-PC.zip
            TVScreenPlus-TV.apk
